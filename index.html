            //Defined in utils.js
            var slfaArrays = parseCipherTextToKslfaArrays(cipherText, createslfaArrays(keyLength));

            for (let i = 0; i < keyLength; i++) {
                const data = createDataPair(slfaArrays[i]);

                createBarPlotDiv(`key-elements-${i}`,`barplot-key-${i}`);
                createBarPlot(`barplot-key-${i}`, data);

                createSortedTableDiv(`key-elements-${i}`, `table-key-${i}`);
                createSortedTable(`table-key-${i}`, data);

                //Sort data pair by most frequent character in encryption for key-char-i
                const sortedData = d3.sort(data, (a, b) => d3.descending(a.Count, b.Count))
                console.log("B")
                const decryptPairs = [];
                for (let j = 0; j < mostFrequentLettersPrejudice.length; j++) {
                    console.log("AAA")

                    for (let k = i; k < partialDecryptText.length; k = k + keyLength) {
                        //Replace characters matching
                        console.log("HERE: " + k);

                            partialDecryptText[k] = mostFrequentLettersPrejudice[j].Letter;

                    }
                }
            }
