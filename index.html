        <script type="text/javascript">

            //Get cipher text; uppercase letter characters will be from between [65, 90]
            const cipherText = document.getElementById("cipher-text-p").innerText.toUpperCase();
            console.log("C: " + cipherText);

            //Get key length for arrays
            const keyLength = document.getElementById("key-size-input").value;

            //Create array for each character in the key; all character counts initialised to 0
            function createslfaArrays(keyLength) {
                const matrix = [];
                //console.log("KeyLength: " + keyLength);
                for (let i = 0; i < keyLength; i++) {
                    const row = [];
                    for (let j = 0; j < 26; j++) {
                        row.push(0);
                    }
                    //console.log("ROW: " + row);
                    matrix.push(row);
                }
                return matrix;
            }

            var slfaArrays = createslfaArrays(keyLength);

            //Iterate through array 
            for (let i = 0; i < cipherText.length; i++) {

                //If cipherText[i] is in alphabet A-Z
                if ("A" <= cipherText[i] && cipherText[i] <= "Z") 
                    //Increment the character count in the corresponding key
                    console.log(cipherText.charCodeAt(i));
                    slfaArrays[i % keyLength][cipherText.charCodeAt(i) - 65]++;
                    console.log(`k-modulo: ${i % keyLength}, char: ${cipherText[i]} (${cipherText.charCodeAt(i)}), char count: ${slfaArrays[i % keyLength][0]}`);
            }

            console.log("slfaArrays: " + slfaArrays);
